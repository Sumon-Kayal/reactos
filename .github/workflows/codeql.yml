name: "CodeQL"

on:
  push:
  pull_request:
  schedule:
    # Weekly scan, independent of push/PR activity.
    - cron: '21 3 * * 4'

jobs:
  analyze:
    name: Analyze (cpp)
    # Using ubuntu-latest ensures it always runs on the newest LTS (currently 22.04 or 24.04)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Source checkout
      uses: actions/checkout@v4
      with:
        path: src
        persist-credentials: false

    - name: Get RosBE build specifics
      id: get_rosbe_spec
      run: |
        # Use standard tools available on all Ubuntu LTS versions
        echo "march-sha=$(gcc -march=native -Q --help=target | sha1sum | awk '{print $1}')" >> $GITHUB_OUTPUT
        echo "git-sha=$(git ls-remote https://github.com/zefklop/RosBE.git | grep unix_amd64 | awk '{print $1}')" >> $GITHUB_OUTPUT
        curl -fsSLo build_rosbe_ci.sh https://gist.githubusercontent.com/zefklop/b2d6a0b470c70183e93d5285a03f5899/raw/e583d55a89e7644780719695acb38cc9f7fd4759/build_rosbe_ci.sh
        echo 'ea42b032fdf9b8b51e993ebe0d1aedc8714f7eff522f4a2fbac7b9aa32a9263c  build_rosbe_ci.sh' | sha256sum -c -

    - name: Get RosBE
      id: get_rosbe
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: RosBE-CI
        key: RosBE-CI-${{ runner.os }}-${{ steps.get_rosbe_spec.outputs.march-sha }}-${{ steps.get_rosbe_spec.outputs.git-sha }}-${{ hashFiles('./build_rosbe_ci.sh') }}

    - name: Compile RosBE
      if: steps.get_rosbe.outputs.cache-hit != 'true'
      run: |
        chmod +x build_rosbe_ci.sh
        ./build_rosbe_ci.sh ${{ github.workspace }}/RosBE-CI

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y ccache ninja-build

    - name: Initialize CodeQL
      uses: github/codeql-action/init@181d5eefc20863364f96762470ba6f862bdef56b # v3.29.2
      with:
        languages: cpp
        build-mode: manual

    - name: Configure
      run: |
        echo 'cmake -S ${{ github.workspace }}/src -B ${{ github.workspace }}/build -G Ninja -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-gcc.cmake -DARCH:STRING=amd64 -DCMAKE_BUILD_TYPE=Release -DDLL_EXPORT_VERSION=0x600 -DENABLE_CCACHE=1' | ${{ github.workspace }}/RosBE-CI/RosBE.sh . 0 amd64

    - name: Build
      run: |
        echo 'cmake --build ${{ github.workspace }}/build -- -k0' | ${{ github.workspace }}/RosBE-CI/RosBE.sh . 0 amd64

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@181d5eefc20863364f96762470ba6f862bdef56b # v3.29.2
      with:
        category: "/language:cpp"
